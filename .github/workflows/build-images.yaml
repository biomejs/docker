name: Build Docker images

on:
  workflow_dispatch:
  repository_dispatch:
    types: [biome-release-cli-event]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/biomejs/biome

jobs:
  generate-jobs:
    name: Generate jobs
    runs-on: ubuntu-latest
    outputs:
      biome-versions: ${{ steps.matrix.outputs.BIOME_VERSIONS }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install
      - name: Generate matrix
        id: matrix
        run: |
          BIOME_VERSIONS=$(bun run ./scripts/generate-versions.ts)
          echo "BIOME_VERSIONS=$BIOME_VERSIONS" >> $GITHUB_OUTPUT

  build-images-arm64:
    name: ${{ matrix.versions.patch }} (${{ matrix.variant }}, arm64)
    needs: generate-jobs
    concurrency: build-images-${{ matrix.versions.patch }}-${{ matrix.variant }}-arm64
    permissions:
      packages: write
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        versions: ${{ fromJson(needs.generate-jobs.outputs.biome-versions) }}
        variant:
          - distroless
          - alpine
          - debian
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Log in to the Container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare variant metadata
        id: variant
        run: |
          case "${{ matrix.variant }}" in
            distroless)
              TARGET=distroless
              INTERNAL_TAG="${IMAGE_NAME}:${{ matrix.versions.patch }}-distroless-arm64"
              TAGS="${INTERNAL_TAG}"$'\n'"${IMAGE_NAME}:${{ matrix.versions.patch }}-arm64"
              ;;
            alpine)
              TARGET=alpine
              INTERNAL_TAG="${IMAGE_NAME}:${{ matrix.versions.patch }}-alpine-arm64"
              TAGS="${INTERNAL_TAG}"
              ;;
            debian)
              TARGET=debian
              INTERNAL_TAG="${IMAGE_NAME}:${{ matrix.versions.patch }}-debian-arm64"
              TAGS="${INTERNAL_TAG}"
              ;;
          esac

          {
            echo "target=${TARGET}"
            echo "internal_tag=${INTERNAL_TAG}"
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ steps.variant.outputs.tags }}
          target: ${{ steps.variant.outputs.target }}
          file: Dockerfile
          cache-from: type=gha,scope=${{ matrix.versions.patch}}-${{ matrix.variant }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.versions.patch}}-${{ matrix.variant }}-arm64
          build-args: |
            ARCH=arm64
            BIOME_VERSION=${{ matrix.versions.patch }}
            BIOME_TAG_START=${{ matrix.versions.major == '2' && '@biomejs/biome@' || 'cli/v'  }}
      - name: Verify image
        run: |
          docker run --pull=never --rm ${{ steps.variant.outputs.internal_tag }} --version
          docker run --pull=never --rm --entrypoint /usr/bin/git ${{ steps.variant.outputs.internal_tag }} --version
          docker run --pull=never --rm -v "$PWD":/code --entrypoint /usr/bin/git ${{ steps.variant.outputs.internal_tag }} status --short
          docker run --pull=never --rm -v "$PWD":/code ${{ steps.variant.outputs.internal_tag }} check biome.json

  build-images-amd64:
    name: ${{ matrix.versions.patch }} (${{ matrix.variant }}, amd64)
    needs: generate-jobs
    concurrency: build-images-${{ matrix.versions.patch }}-${{ matrix.variant }}-amd64
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        versions: ${{ fromJson(needs.generate-jobs.outputs.biome-versions) }}
        variant:
          - distroless
          - alpine
          - debian
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Log in to the Container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare variant metadata
        id: variant
        run: |
          case "${{ matrix.variant }}" in
            distroless)
              TARGET=distroless
              INTERNAL_TAG="${IMAGE_NAME}:${{ matrix.versions.patch }}-distroless-amd64"
              TAGS="${INTERNAL_TAG}"$'\n'"${IMAGE_NAME}:${{ matrix.versions.patch }}-amd64"
              ;;
            alpine)
              TARGET=alpine
              INTERNAL_TAG="${IMAGE_NAME}:${{ matrix.versions.patch }}-alpine-amd64"
              TAGS="${INTERNAL_TAG}"
              ;;
            debian)
              TARGET=debian
              INTERNAL_TAG="${IMAGE_NAME}:${{ matrix.versions.patch }}-debian-amd64"
              TAGS="${INTERNAL_TAG}"
              ;;
          esac

          {
            echo "target=${TARGET}"
            echo "internal_tag=${INTERNAL_TAG}"
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.variant.outputs.tags }}
          target: ${{ steps.variant.outputs.target }}
          file: Dockerfile
          cache-from: type=gha,scope=${{ matrix.versions.patch}}-${{ matrix.variant }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.versions.patch}}-${{ matrix.variant }}-amd64
          build-args: |
            ARCH=x64
            BIOME_VERSION=${{ matrix.versions.patch }}
            BIOME_TAG_START=${{ matrix.versions.major == '2' && '@biomejs/biome@' || 'cli/v'  }}
      - name: Verify image
        run: |
          docker run --pull=never --rm ${{ steps.variant.outputs.internal_tag }} --version
          docker run --pull=never --rm --entrypoint /usr/bin/git ${{ steps.variant.outputs.internal_tag }} --version
          docker run --pull=never --rm -v "$PWD":/code --entrypoint /usr/bin/git ${{ steps.variant.outputs.internal_tag }} status --short
          docker run --pull=never --rm -v "$PWD":/code ${{ steps.variant.outputs.internal_tag }} check biome.json

  stitch-images:
    name: Stitch images (${{ matrix.versions.patch }})
    needs: [generate-jobs, build-images-arm64, build-images-amd64]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      matrix:
        versions: ${{ fromJson(needs.generate-jobs.outputs.biome-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Log in to the Container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create image manifests
        env:
          PATCH: ${{ matrix.versions.patch }}
          MAJOR: ${{ matrix.versions.major }}
          MINOR: ${{ matrix.versions.minor }}
          CREATE_MAJOR: ${{ matrix.versions.createMajor }}
          CREATE_MINOR: ${{ matrix.versions.createMinor }}
          IS_LATEST: ${{ matrix.versions.patch == fromJson(needs.generate-jobs.outputs.biome-versions)[0].patch }}
        run: |
          create_manifest() {
            local public_tag="$1"
            local variant="$2"
            local destination="${IMAGE_NAME}:${public_tag}"

            if [ "${variant}" != "distroless" ]; then
              destination="${destination}-${variant}"
            fi

            docker manifest create "${destination}" \
              "${IMAGE_NAME}:${PATCH}-${variant}-arm64" \
              "${IMAGE_NAME}:${PATCH}-${variant}-amd64"
            docker manifest push "${destination}"
          }

          if [ "${CREATE_MAJOR}" = "true" ]; then
            create_manifest "${MAJOR}" distroless
            create_manifest "${MAJOR}" alpine
            create_manifest "${MAJOR}" debian
          fi

          if [ "${CREATE_MINOR}" = "true" ]; then
            create_manifest "${MINOR}" distroless
            create_manifest "${MINOR}" alpine
            create_manifest "${MINOR}" debian
          fi

          create_manifest "${PATCH}" distroless
          create_manifest "${PATCH}" alpine
          create_manifest "${PATCH}" debian

          if [ "${IS_LATEST}" = "true" ]; then
            create_manifest latest distroless
            create_manifest latest alpine
            create_manifest latest debian
          fi
