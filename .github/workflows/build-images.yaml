name: Build Docker images

on:
  workflow_dispatch:
  schedule:
    # run every sunday at midnight
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  generate-jobs:
    name: Generate jobs
    runs-on: ubuntu-latest
    outputs:
      biome-versions: ${{ steps.matrix.outputs.BIOME_VERSIONS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Generate matrix
        id: matrix
        run: |
          BIOME_VERSIONS=$(bun run ./scripts/generate-versions.ts)
          echo "BIOME_VERSIONS=$BIOME_VERSIONS" >> $GITHUB_OUTPUT

  build-images-arm64:
    name: ${{ matrix.biome-versions.version }} (arm64)
    needs: generate-jobs
    concurrency: build-images-${{ matrix.biome-versions.version }}-arm64
    permissions:
      packages: write
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        biome-versions: ${{ fromJson(needs.generate-jobs.outputs.biome-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: false
          platforms: linux/arm64
          tags: ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-arm64
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BIOME_VERSION=${{ matrix.biome-versions.version }}

  build-images-amd64:
    name: ${{ matrix.biome-versions.version }} (amd64)
    needs: generate-jobs
    concurrency: build-images-${{ matrix.biome-versions.version }}-amd64
    permissions:
      packages: write
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        biome-versions: ${{ fromJson(needs.generate-jobs.outputs.biome-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: false
          platforms: linux/amd64
          tags: ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-amd64
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BIOME_VERSION=${{ matrix.biome-versions.version }}  

  stitch-images:
    name: Stitch images
    needs: [generate-jobs, build-images-arm64, build-images-amd64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        biome-versions: ${{ fromJson(needs.generate-jobs.outputs.biome-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create major version (${{ matrix.biome-versions.majorVersion }}) manifest
        if: ${{ matrix.biome-versions.createMajorAlias }}
        run: |
          docker manifest create ghcr.io/biomejs/biome:${{ matrix.biome-versions.majorVersion }} \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-arm64 \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-amd64

      - name: Create minor version (${{ matrix.biome-versions.minorVersion }}) manifest
        if: ${{ matrix.biome-versions.createMinorAlias }}
        run: |
          docker manifest create ghcr.io/biomejs/biome:${{ matrix.biome-versions.minorVersion }} \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-arm64 \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-amd64

      - name: Create patch version (${{ matrix.biome-versions.patchVersion }}) manifest
        run: |
          docker manifest create ghcr.io/biomejs/biome:${{ matrix.biome-versions.patchVersion }} \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-arm64 \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-amd64

      - name: Create latest (${{ matrix.biome-versions.version }}) manifest
        if: ${{ matrix.biome-versions.version == fromJson(needs.generate-jobs.outputs.biome-versions)[0].version }}
        run: |
          docker manifest create ghcr.io/biomejs/biome:latest \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-arm64 \
            ghcr.io/biomejs/biome:${{ matrix.biome-versions.version }}-amd64

      - name: Push major version (${{ matrix.biome-versions.majorVersion }}) manifest
        if: ${{ github.event_name != 'pull_request' }} && matrix.biome-versions.createMajorAlias
        run: |
          docker manifest push ghcr.io/biomejs/biome:${{ matrix.biome-versions.majorVersion }}

      - name: Push minor version (${{ matrix.biome-versions.minorVersion }}) manifest
        if: ${{ github.event_name != 'pull_request' }} && matrix.biome-versions.createMinorAlias
        run: |
          docker manifest push ghcr.io/biomejs/biome:${{ matrix.biome-versions.minorVersion }}

      - name: Push patch version (${{ matrix.biome-versions.patchVersion }}) manifest
        run: |
          docker manifest push ghcr.io/biomejs/biome:${{ matrix.biome-versions.patchVersion }}

      - name: Push latest manifest
        if: ${{ github.event_name != 'pull_request' && matrix.biome-versions.version == fromJson(needs.generate-jobs.outputs.biome-versions)[0].version }}
        run: |
          docker manifest push ghcr.io/biomejs/biome:latest
      
